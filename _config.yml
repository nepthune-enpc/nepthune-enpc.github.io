title                    : Nepthune
github                   : [metadata]
url                      : https://nepthune-enpc.github.io
baseurl                  : ""
# theme: jekyll-theme-nepthune


head_scripts:
  - https://code.jquery.com/jquery-3.2.1.min.js

jekyll_auth:
  whitelist:
    - drafts?
include:
  - _pages
  - files
  - .htaccess
  - assets
exclude:
  - script
  - bin
  - lib
  - Gemfile
  - Gemfile.lock
  - jekyll-auth.gemspec
  - jekyll-auth*.gem
  - config.ru
  - Rakefile
  - readme.md
  - vendor
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
# Sass/SCSS
sass:
  sass_dir: _sass
  style: compact

