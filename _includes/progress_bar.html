<style>
    .stepper-wrapper {
        /*justify-content: center;*/
        display: flex;
        margin-bottom: 4%;

    }

    .stepper-item {
          position: relative;
          display: inline-flex;
          flex-direction: column;
          align-items: center;
          flex: 1;
        margin-bottom: 5%;

          @media (max-width: 768px) {
            font-size: 12px;
          }
        }



    .stepper-item::before {
      position: absolute;
      content: "";
      border-bottom: 3px solid #ccc;
      width: 100%;
      top: 25%;
      left: -50%;
      z-index: 2;
    }

    .stepper-item::after {
      position: absolute;
      content: "";
      border-bottom: 3px solid #ccc;
      width: 100%;
      top: 25%;
      left: 50%;
      z-index: 2;
    }

    .stepper-item .step-counter {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ccc;
      color: #ffffff;
      /*margin-bottom: 2%;*/
    }
    .stepper-item.completed .step-counter {
  background-color: #1a4173;
}



    .stepper-item.active {
          font-weight: bold;
        }


    .stepper-item.completed::after {
      position: absolute;
      content: "";
      border-bottom: 5px solid #1a4173;
      width: 100%;
      /*top: 25%;*/
      left: 50%;
      z-index: 3;
    }
    .stepper-item:first-child::before {
      content: none;
    }
    .stepper-item:last-child::after {
      content: none;
    }
</style>

<div class="stepper-wrapper border-bottom mb-4">
    <div class="stepper-item completed">
        <div class="step-counter">1</div>
        <div class="step-name">Coordonnees</div>
      </div>
      <div class="stepper-item completed">
        <div class="step-counter">2</div>
        <div class="step-name">Etudes</div>
      </div>
    <div class="stepper-item active">
        <div class="step-counter">3</div>
        <div class="step-name">Third</div>
      </div>
      <div class="stepper-item">
        <div class="step-counter">4</div>
        <div class="step-name">Forth</div>
      </div>
</div>
